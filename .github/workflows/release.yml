name: Release

# 推送 v 开头的 tag（例如 v0.1.0）时触发：跑单元测试、编译签名后的 release APK、发布到 GitHub Releases。
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      # tag 必须和 app/build.gradle.kts 里的 appVersionName 一致，防止发出版本号对不上的包
      - name: Check tag matches versionName
        run: |
          version=$(sed -nE 's/^val appVersionName = "([^"]+)"/\1/p' app/build.gradle.kts)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME 和 appVersionName $version 不一致" >&2
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Decode signing keystore
        env:
          QDUO_KEYSTORE_BASE64: ${{ secrets.QDUO_KEYSTORE_BASE64 }}
        run: |
          echo "$QDUO_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "QDUO_KEYSTORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"

      - name: Unit tests and signed release APK
        env:
          QDUO_KEYSTORE_PASSWORD: ${{ secrets.QDUO_KEYSTORE_PASSWORD }}
        run: ./gradlew :app:testDebugUnitTest :app:assembleRelease --no-daemon

      # 确认 APK 真的签上了 release 密钥，没签名就不发布
      - name: Verify APK signature
        run: |
          apk=$(ls app/build/outputs/apk/release/*.apk)
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs "$apk"
          echo "APK=$apk" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$(dirname "$APK")"
          name=$(basename "$APK")
          sha256sum "$name" > "$name.sha256"
          gh release create "$GITHUB_REF_NAME" "$name" "$name.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --title "QDuoDroid $GITHUB_REF_NAME" \
            --generate-notes
